name: Feature request
description: Suggest an idea or improvement for Juno.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Juno to do?
      placeholder: It would help if Juno could...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is this useful?
      description: What problem does it solve, or what would it make easier?
    validations:
      required: false
